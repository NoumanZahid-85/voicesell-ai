name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check app/ tests/ scripts/

      - name: Format check (ruff)
        run: uv run ruff format --check app/ tests/ scripts/

      - name: Type check (pyright)
        run: uv run pyright app/
        continue-on-error: true # pyright may flag 3rd-party stubs missing

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///test.db"
          QDRANT_URL: "http://localhost:6333"
        run: uv run pytest tests/ -v --tb=short
        continue-on-error: true # tests need DB; will fully pass in docker

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t voicesell-backend ./backend
